name: Daily Football Updater
on:
  schedule:
    # Runs every day at 6:00 AM UTC (11:30 AM IST)
    - cron: '44 6 * * *'
  workflow_dispatch:
jobs:
  send-football-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm init -y && npm install nodemailer
          fi
      - name: Execute Football Email Script
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: node football_email.js
